<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Control Center - UrbanAtmo</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans text-gray-800">
    <header class="bg-green-900 text-white shadow-md">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">Platform Administrator Control Center</h1>
            <nav class="space-x-4 text-sm font-medium">
                <a href="index.html" class="hover:underline">Home</a>
                <a href="kabadiwala.html" class="hover:underline">Kabadiwala Portal</a>
                <a href="school.html" class="hover:underline">School Portal</a>
                <a href="admin.html" class="underline">Admin Panel</a>
            </nav>
        </div>
    </header>
    <main class="container mx-auto px-6 py-8">
        <div class="bg-white p-6 rounded-xl shadow-sm border space-y-6">
            <h2 class="text-lg font-bold text-green-900">System Metrics & Overview</h2>
            <div id="adminMetrics" class="grid grid-cols-1 md:grid-cols-4 gap-4"></div>
        </div>
    </main>
    <script>
        async function loadAdminMetrics() {
            const res = await fetch('/api/admin/metrics');
            const metrics = await res.json();
            const container = document.getElementById('adminMetrics');
            container.innerHTML = `
                <div class="p-4 bg-gray-50 rounded border"><p class="text-xs text-gray-500 font-bold">Total Pickups</p><p class="text-2xl font-bold mt-1">${metrics.totalPickups}</p></div>
                <div class="p-4 bg-gray-50 rounded border"><p class="text-xs text-gray-500 font-bold">Active Schools</p><p class="text-2xl font-bold mt-1">${metrics.activeSchools}</p></div>
                <div class="p-4 bg-gray-50 rounded border"><p class="text-xs text-gray-500 font-bold">Registered Students</p><p class="text-2xl font-bold mt-1">${metrics.totalRegisteredStudents}</p></div>
                <div class="p-4 bg-green-50 rounded border border-green-200"><p class="text-xs text-green-600 font-bold">System Status</p><p class="text-xs font-semibold text-green-800 mt-2">${metrics.systemHealth}</p></div>
            `;
        }
        loadAdminMetrics();
    </script>
</body>
</html>
